[project]
name = "roofsignal"
version = "0.1.0"
description = "Home-services lead generation: property signals, compliant outreach, exclusive lead marketplace"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "geoalchemy2>=0.15",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "shapely>=2.0",
  "rq>=1.16",
  "redis>=5.0",
  "typer>=0.12",
  "pyshp>=3.1.8",
  "pyproj>=3.8.0",
  "argon2-cffi>=25.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "hypothesis>=6.100",
]

[project.scripts]
roofsignal = "roofsignal.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roofsignal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs a PostGIS database (TEST_DATABASE_URL)"]

[tool.coverage.run]
source = ["roofsignal"]
branch = true
