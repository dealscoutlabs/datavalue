# Scoring weights and thresholds. Every scoring run stores the SHA-256 of this file's parsed content plus a full
# snapshot, so any score can be traced back to the exact weights that produced it.
#
# score = sum over counted signals of 100 * weight * normalized * confidence / sum(weights of counted signals)
# A signal is "counted" when enabled and not a mock (unless include_mock_signals: true, for demos only).
version: "2026-11-13.2"

trades:
  roofing:
    enabled: true
    include_mock_signals: false
    # A = a qualifying storm hit an older home hard enough (e.g. hail >= 1.5" on a 30+ year-old home, or
    # >= ~70 mph wind). A single 1" hail report on an old home lands in B. Tuned 2026-11-13 on Dallas/Suffolk data.
    tiers: {A: 75, B: 50, C: 30}   # anything below C is D
    signals:
      storm:
        weight: 0.45
        params:
          lookback_months: 12
          hail_min_in: 1.0       # qualifies at >= 1" hail
          hail_full_in: 2.0      # full credit at 2"
          hail_base: 0.7         # normalized value at the minimum qualifying size
          wind_min_mph: 58       # qualifies at >= 58 mph (NWS severe threshold, 50 kt)
          wind_full_mph: 80
          wind_base: 0.6
      roof_age:
        weight: 0.45
        params:
          # [age_years, normalized] points, linearly interpolated
          curve: [[0, 0], [10, 0], [15, 0.3], [20, 0.6], [25, 0.85], [30, 1.0]]
          recent_permit_years: 5        # roof permit within 5 years -> roof is new, 0 credit
          year_built_confidence: 0.7    # year built is a weaker proxy for roof age than a roof permit
      imagery:
        weight: 0.10
        params:
          poor_threshold: 0.7
          fair_threshold: 0.4

  hvac:
    enabled: false   # later: equipment age from mechanical permits + year built
    tiers: {A: 70, B: 50, C: 30}
    signals: {}

  driveway:
    enabled: false
    tiers: {A: 70, B: 50, C: 30}
    signals: {}
